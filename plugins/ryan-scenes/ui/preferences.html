<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ryan Scenes 偏好面板</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: light-dark(#171717, #f4f1eb);
        --muted: light-dark(#6f6b65, #aaa49b);
        --paper: light-dark(#f5f0e7, #24211d);
        --card: light-dark(#fffdf8, #302c27);
        --line: light-dark(#d9d0c3, #514a42);
        --accent: #e1432f;
      }

      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--paper); }
      main { max-width: 720px; margin: 0 auto; padding: 22px; }
      header { margin-bottom: 18px; }
      .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-family: ui-serif, Georgia, serif; font-size: clamp(24px, 5vw, 36px); font-weight: 650; line-height: 1.08; }
      .scene-summary { max-width: 60ch; margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
      form { display: grid; gap: 14px; }
      fieldset { min-width: 0; margin: 0; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
      legend { display: flex; align-items: center; gap: 9px; padding: 0 5px; font-size: 15px; font-weight: 750; }
      legend > span { color: var(--accent); font-size: 11px; letter-spacing: .08em; }
      .option-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 5px; }
      .option { position: relative; display: grid; grid-template-columns: 18px 1fr; gap: 9px; min-height: 108px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .15s ease, transform .15s ease, background .15s ease; }
      .option:hover { transform: translateY(-1px); border-color: var(--accent); }
      .option:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); box-shadow: inset 0 0 0 1px var(--accent); }
      input { position: absolute; opacity: 0; pointer-events: none; }
      .radio-marker { width: 16px; height: 16px; margin-top: 2px; border: 1.5px solid var(--muted); border-radius: 50%; }
      input:checked + .radio-marker { border: 5px solid var(--accent); }
      input:focus-visible + .radio-marker { outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent); outline-offset: 2px; }
      .option-copy { display: flex; flex-direction: column; gap: 6px; }
      .option-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; font-weight: 760; }
      .option-description { color: var(--muted); font-size: 12px; line-height: 1.45; }
      .badge { padding: 2px 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .06em; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 2px 0; }
      .status { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
      button { flex: 0 0 auto; min-width: 122px; padding: 11px 18px; border: 0; border-radius: 999px; background: var(--accent); color: white; font: inherit; font-size: 13px; font-weight: 760; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      .submitted fieldset { pointer-events: none; opacity: .65; }
      .fallback { margin-top: 14px; padding: 13px; border: 1px dashed var(--accent); border-radius: 12px; }
      .fallback p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
      textarea { width: 100%; min-height: 78px; resize: vertical; padding: 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--card); font: inherit; font-size: 12px; }

      @media (max-width: 600px) {
        main { padding: 16px; }
        .option-list { grid-template-columns: 1fr; }
        .option { min-height: auto; }
        footer { align-items: stretch; flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Ryan Scenes · v2.0</p>
        <h1>正在准备选项…</h1>
        <p class="scene-summary"></p>
      </header>
      <form hidden>
        <div class="questions"></div>
        <footer>
          <p class="status" aria-live="polite"></p>
          <button type="submit">确认并继续</button>
        </footer>
      </form>
      <section class="fallback" hidden>
        <p></p>
        <textarea readonly aria-label="可复制的选择结果"></textarea>
      </section>
    </main>
    <script>/*__RYAN_SCENES_UI_BUNDLE__*/</script>
  </body>
</html>
